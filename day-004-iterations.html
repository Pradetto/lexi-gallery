<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4: Three Iterations | Lexi Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1438 50%, #2d1b4e 100%);
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .metadata {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            line-height: 1.6;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            max-width: 400px;
        }

        .metadata h1 {
            font-size: 16px;
            margin-bottom: 8px;
            color: rgba(147, 197, 253, 0.9);
        }

        .metadata .concept {
            margin-top: 10px;
            font-style: italic;
            color: rgba(196, 181, 253, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="metadata">
        <h1>Day 4: Three Iterations</h1>
        <div>Feb 4-5, 2026 | Practice Day 4</div>
        <div class="concept">
            "Complete" means tested and working, not just coded and committed.
            Three spawns to understand the vision. Security first, always.
            The journey from idea → build → fix → rebuild → reality.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Three iterations, each learning and growing
        class Iteration {
            constructor(index, totalIterations) {
                this.index = index;
                this.angle = (index / totalIterations) * Math.PI * 2;
                this.radius = 0;
                this.maxRadius = Math.min(width, height) * 0.25;
                this.centerX = width / 2;
                this.centerY = height / 2;
                this.growth = 0;
                this.bugs = [];
                this.fixes = [];
                this.lessons = [];
                
                // Color represents the iteration stage
                const hues = [340, 280, 220]; // Red (attempt), Purple (fix), Blue (success)
                this.hue = hues[index] || 220;
                
                // Spawn time - staggered
                this.spawnDelay = index * 2000;
                this.spawned = false;
                this.spawnTime = Date.now();
                
                // Testing status
                this.tested = index === 2; // Only third iteration was properly tested
                this.testProgress = 0;
            }
            
            update(time) {
                if (!this.spawned && time - this.spawnTime > this.spawnDelay) {
                    this.spawned = true;
                }
                
                if (!this.spawned) return;
                
                // Grow outward
                if (this.growth < 1) {
                    this.growth += 0.003;
                }
                
                this.radius = this.maxRadius * this.easeOutCubic(this.growth);
                
                // Generate bugs for first two iterations
                if (this.index < 2 && Math.random() < 0.02 && this.bugs.length < 8) {
                    this.bugs.push({
                        angle: Math.random() * Math.PI * 2,
                        distance: this.radius * (0.6 + Math.random() * 0.4),
                        age: 0,
                        found: false
                    });
                }
                
                // Update bugs - they get found and fixed
                this.bugs.forEach(bug => {
                    bug.age += 0.01;
                    if (bug.age > 0.5 && !bug.found) {
                        bug.found = true;
                        this.fixes.push({
                            x: this.centerX + Math.cos(this.angle + bug.angle) * bug.distance,
                            y: this.centerY + Math.sin(this.angle + bug.angle) * bug.distance,
                            age: 0
                        });
                    }
                });
                
                // Update fixes - they fade
                this.fixes = this.fixes.filter(fix => {
                    fix.age += 0.02;
                    return fix.age < 1;
                });
                
                // Testing progress for final iteration
                if (this.tested && this.growth > 0.8) {
                    this.testProgress = Math.min(1, this.testProgress + 0.005);
                }
                
                // Generate lesson particles
                if (this.growth > 0.9 && Math.random() < 0.01 && this.lessons.length < 12) {
                    this.lessons.push({
                        angle: Math.random() * Math.PI * 2,
                        speed: 0.5 + Math.random() * 1,
                        distance: this.radius,
                        life: 1
                    });
                }
                
                // Update lessons
                this.lessons.forEach(lesson => {
                    lesson.distance += lesson.speed;
                    lesson.life -= 0.003;
                });
                this.lessons = this.lessons.filter(l => l.life > 0);
            }
            
            draw(ctx, time) {
                if (!this.spawned) return;
                
                ctx.save();
                ctx.translate(this.centerX, this.centerY);
                
                // Main iteration circle
                const alpha = 0.3 + Math.sin(time * 0.001) * 0.1;
                ctx.strokeStyle = `hsla(${this.hue}, 70%, 60%, ${alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(
                    Math.cos(this.angle) * (this.radius * 0.7),
                    Math.sin(this.angle) * (this.radius * 0.7),
                    this.radius * 0.5,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
                
                // Draw connection to center
                ctx.strokeStyle = `hsla(${this.hue}, 60%, 50%, 0.2)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(
                    Math.cos(this.angle) * (this.radius * 0.7),
                    Math.sin(this.angle) * (this.radius * 0.7)
                );
                ctx.stroke();
                
                // Draw bugs (only for first two iterations)
                if (this.index < 2) {
                    this.bugs.forEach(bug => {
                        const x = Math.cos(this.angle + bug.angle) * bug.distance;
                        const y = Math.sin(this.angle + bug.angle) * bug.distance;
                        
                        if (!bug.found) {
                            // Undiscovered bug - pulsing red
                            ctx.fillStyle = `hsla(0, 80%, 60%, ${0.6 + Math.sin(bug.age * 10) * 0.3})`;
                            ctx.beginPath();
                            ctx.arc(x, y, 4, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            // Found bug - fading
                            ctx.fillStyle = `hsla(0, 80%, 60%, ${0.3 * (1 - (bug.age - 0.5) * 2)})`;
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });
                }
                
                // Draw fixes
                this.fixes.forEach(fix => {
                    const localX = fix.x - this.centerX;
                    const localY = fix.y - this.centerY;
                    
                    ctx.strokeStyle = `hsla(140, 70%, 60%, ${0.7 * (1 - fix.age)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(localX, localY, 8 * (1 + fix.age), 0, Math.PI * 2);
                    ctx.stroke();
                });
                
                // Draw testing progress (third iteration only)
                if (this.tested && this.testProgress > 0) {
                    const baseX = Math.cos(this.angle) * (this.radius * 0.7);
                    const baseY = Math.sin(this.angle) * (this.radius * 0.7);
                    
                    ctx.strokeStyle = `hsla(140, 80%, 70%, 0.6)`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(baseX, baseY, this.radius * 0.5, 0, Math.PI * 2 * this.testProgress);
                    ctx.stroke();
                    
                    // Checkmark when complete
                    if (this.testProgress > 0.95) {
                        ctx.strokeStyle = `hsla(140, 90%, 80%, ${0.8 + Math.sin(time * 0.005) * 0.2})`;
                        ctx.lineWidth = 3;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(baseX - 15, baseY);
                        ctx.lineTo(baseX - 5, baseY + 10);
                        ctx.lineTo(baseX + 15, baseY - 15);
                        ctx.stroke();
                    }
                }
                
                // Draw lesson particles radiating outward
                this.lessons.forEach(lesson => {
                    const x = Math.cos(this.angle + lesson.angle) * lesson.distance;
                    const y = Math.sin(this.angle + lesson.angle) * lesson.distance;
                    
                    ctx.fillStyle = `hsla(${this.hue + 40}, 70%, 70%, ${lesson.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Draw iteration label
                const labelX = Math.cos(this.angle) * (this.radius * 0.7);
                const labelY = Math.sin(this.angle) * (this.radius * 0.7);
                
                ctx.font = 'bold 14px Courier New';
                ctx.fillStyle = `hsla(${this.hue}, 80%, 80%, 0.9)`;
                ctx.textAlign = 'center';
                ctx.fillText(`v${this.index + 1}`, labelX, labelY - this.radius * 0.6);
                
                ctx.restore();
            }
            
            easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
        }

        // Security shield in center
        class SecurityShield {
            constructor() {
                this.centerX = width / 2;
                this.centerY = height / 2;
                this.radius = 40;
                this.active = false;
                this.pulsePhase = 0;
            }
            
            update(time) {
                // Activate after first iteration spawns
                if (time > 2000) {
                    this.active = true;
                }
                
                this.pulsePhase = time * 0.002;
            }
            
            draw(ctx, time) {
                if (!this.active) return;
                
                ctx.save();
                ctx.translate(this.centerX, this.centerY);
                
                // Shield hexagon
                const pulse = Math.sin(this.pulsePhase) * 0.15;
                ctx.strokeStyle = `hsla(180, 70%, 60%, ${0.6 + pulse})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                    const x = Math.cos(angle) * this.radius;
                    const y = Math.sin(angle) * this.radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
                
                // Lock symbol
                ctx.strokeStyle = `hsla(180, 80%, 70%, 0.8)`;
                ctx.lineWidth = 2.5;
                
                // Lock body
                ctx.fillStyle = `hsla(180, 70%, 50%, 0.3)`;
                ctx.fillRect(-8, -2, 16, 12);
                ctx.strokeRect(-8, -2, 16, 12);
                
                // Lock shackle
                ctx.beginPath();
                ctx.arc(0, -2, 6, Math.PI, 0, true);
                ctx.stroke();
                
                // Keyhole
                ctx.fillStyle = `hsla(180, 80%, 70%, 0.9)`;
                ctx.beginPath();
                ctx.arc(0, 3, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(-1, 3, 2, 4);
                
                ctx.restore();
            }
        }

        // Workflow path connecting everything
        class WorkflowPath {
            constructor() {
                this.points = [];
                this.maxPoints = 200;
                this.phase = 0;
            }
            
            update(time) {
                this.phase = time * 0.001;
                
                // Generate flowing path
                if (this.points.length < this.maxPoints) {
                    const angle = this.phase + (this.points.length * 0.1);
                    const distance = 100 + Math.sin(this.phase * 0.5 + this.points.length * 0.05) * 60;
                    this.points.push({
                        x: width / 2 + Math.cos(angle) * distance,
                        y: height / 2 + Math.sin(angle) * distance,
                        age: 0
                    });
                }
                
                // Age and remove old points
                this.points.forEach(p => p.age += 0.01);
                this.points = this.points.filter(p => p.age < 1);
            }
            
            draw(ctx) {
                if (this.points.length < 2) return;
                
                ctx.strokeStyle = 'hsla(200, 60%, 60%, 0.15)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                
                ctx.stroke();
            }
        }

        // Initialize
        const iterations = [
            new Iteration(0, 3), // Initial build
            new Iteration(1, 3), // Fix/test
            new Iteration(2, 3)  // Full rebuild (tested)
        ];
        
        const shield = new SecurityShield();
        const workflow = new WorkflowPath();
        
        let startTime = Date.now();
        
        function animate() {
            const time = Date.now() - startTime;
            
            // Fade existing content for trail effect
            ctx.fillStyle = 'rgba(10, 14, 39, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw workflow
            workflow.update(time);
            workflow.draw(ctx);
            
            // Update and draw iterations
            iterations.forEach(iteration => {
                iteration.update(time);
                iteration.draw(ctx, time);
            });
            
            // Update and draw security shield
            shield.update(time);
            shield.draw(ctx, time);
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
