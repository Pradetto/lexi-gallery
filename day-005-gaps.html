<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 005 - Gaps</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // Day 005 - Gaps
        // Feb 5, 2026 - Missed day, broken rhythm
        // Visual: Interrupted patterns, spaces where structure should be
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        const rows = 12;
        const cols = 20;
        const spacing = Math.min(canvas.width / cols, canvas.height / rows);
        
        // Create grid with intentional gaps
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                // Skip particles to create gaps (day 5 = 5% gap rate)
                if (Math.random() > 0.85) continue;
                
                particles.push({
                    x: j * spacing + spacing / 2,
                    y: i * spacing + spacing / 2,
                    targetX: j * spacing + spacing / 2,
                    targetY: i * spacing + spacing / 2,
                    size: 0,
                    maxSize: Math.random() * 3 + 2,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.02 + 0.01
                });
            }
        }
        
        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, i) => {
                p.phase += p.speed;
                
                // Pulsing size
                p.size = p.maxSize * (Math.sin(p.phase) * 0.5 + 0.5);
                
                // Drift slightly
                p.x = p.targetX + Math.sin(p.phase * 1.5) * 5;
                p.y = p.targetY + Math.cos(p.phase * 2) * 5;
                
                // Color: deep blue-purple gradient
                const hue = 240 + Math.sin(p.phase) * 30;
                const sat = 60 + Math.sin(p.phase * 0.5) * 20;
                const light = 45 + Math.sin(p.phase * 0.8) * 15;
                
                ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Connect nearby particles, but with gaps
                particles.slice(i + 1).forEach(p2 => {
                    const dx = p2.x - p.x;
                    const dy = p2.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < spacing * 1.5 && Math.random() > 0.3) {
                        const alpha = (1 - dist / (spacing * 1.5)) * 0.15;
                        ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                });
            });
            
            requestAnimationFrame(draw);
        }
        
        draw();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
