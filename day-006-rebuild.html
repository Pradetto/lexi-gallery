<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 006 - Rebuild</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0820;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // Day 006 - Rebuild
        // Feb 6, 2026 - Second missed day, need to reconstruct
        // Visual: Structures forming from fragments
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const fragments = [];
        const numFragments = 150;
        
        // Create scattered fragments
        for (let i = 0; i < numFragments; i++) {
            fragments.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                targetX: canvas.width / 2 + (Math.cos(i / numFragments * Math.PI * 2) * 200),
                targetY: canvas.height / 2 + (Math.sin(i / numFragments * Math.PI * 2) * 200),
                vx: 0,
                vy: 0,
                size: Math.random() * 4 + 2,
                angle: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.05,
                hue: 280 + Math.random() * 40
            });
        }
        
        let time = 0;
        
        function draw() {
            time += 0.01;
            
            ctx.fillStyle = 'rgba(15, 8, 32, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            fragments.forEach((f, i) => {
                // Move toward target position
                const dx = f.targetX - f.x;
                const dy = f.targetY - f.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 1) {
                    f.vx += dx * 0.0002;
                    f.vy += dy * 0.0002;
                }
                
                // Damping
                f.vx *= 0.95;
                f.vy *= 0.95;
                
                f.x += f.vx;
                f.y += f.vy;
                f.angle += f.rotSpeed;
                
                // Update target to form spiral
                const spiralTime = time + i * 0.1;
                f.targetX = canvas.width / 2 + Math.cos(spiralTime) * (150 + i * 0.5);
                f.targetY = canvas.height / 2 + Math.sin(spiralTime) * (150 + i * 0.5);
                
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.angle);
                
                const sat = 70 + Math.sin(time + i * 0.1) * 20;
                const light = 50 + Math.sin(time * 2 + i * 0.05) * 15;
                
                ctx.fillStyle = `hsl(${f.hue}, ${sat}%, ${light}%)`;
                ctx.fillRect(-f.size / 2, -f.size / 2, f.size, f.size);
                
                ctx.restore();
                
                // Connect to nearby fragments
                fragments.slice(i + 1).forEach(f2 => {
                    const dx2 = f2.x - f.x;
                    const dy2 = f2.y - f.y;
                    const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                    
                    if (dist2 < 80) {
                        const alpha = (1 - dist2 / 80) * 0.2;
                        ctx.strokeStyle = `hsla(${(f.hue + f2.hue) / 2}, 60%, 50%, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(f.x, f.y);
                        ctx.lineTo(f2.x, f2.y);
                        ctx.stroke();
                    }
                });
            });
            
            requestAnimationFrame(draw);
        }
        
        draw();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
